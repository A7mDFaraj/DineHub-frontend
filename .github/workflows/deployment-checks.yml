name: Deployment checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deployment-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_URL: https://dinehub-backend-42eq.onrender.com/api
      NEXT_PUBLIC_BETTER_AUTH_URL: https://dinehub-backend-42eq.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - run: node scripts/check-deployment.mjs
      - uses: pnpm/setup@v3
        with:
          version: 11.24.0
          runtime: node@24.14.1
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:checkout
      - run: node --experimental-strip-types scripts/verify-menu.mjs
      - run: node --experimental-strip-types scripts/verify-realtime.mjs
      - run: pnpm build:cf
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:customer
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: customer-journey-failures
          path: |
            test-results/
            playwright-report/
